# CloudFav - Cloudflare Pages 项目配置
name = "cloud-fav"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# ---------- 通用变量 ----------
[vars]
# Workers AI 文本生成模型（可按需替换为其它已上线的模型，如 @cf/meta/llama-3.2-3b-instruct）
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# ---------- D1 数据库 ----------
# GitHub Actions 部署时会自动创建/复用 bookmarks-db 并将真实 database_id 写入下面；
# 本地开发或 Dashboard 面板部署时，请先运行 npx wrangler d1 create bookmarks-db 并把 ID 填入此处。
[[d1_databases]]
binding = "DB"
database_name = "bookmarks-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ---------- Workers AI ----------
# 需在 Cloudflare 控制台开通 Workers AI 额度（免费额度内可用）
[[ai]]
binding = "AI"

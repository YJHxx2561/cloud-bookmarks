name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ---- 将 D1 数据库 ID 写入 wrangler.toml（来自仓库 Secret） ----
      # 数据库需先在 Cloudflare 创建：npx wrangler d1 create bookmarks-db
      # 然后把输出的 database_id 添加到仓库 Secrets：D1_DATABASE_ID
      - name: Write D1 database ID into wrangler.toml
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::未配置 D1_DATABASE_ID Secret。请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.toml
          echo "database_id 已写入 wrangler.toml"

      # ---- 应用 D1 迁移（建表） ----
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply bookmarks-db --remote

      # ---- 确保 Pages 项目存在（不存在则自动创建） ----
      # 通过 Cloudflare API 查询，响应格式确定，不解析 wrangler 输出
      - name: Ensure Pages project exists
        run: |
          if curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            | python3 .github/scripts/pages-has.py cloud-fav; then
            echo "Pages 项目 cloud-fav 已存在，跳过创建（更新部署）"
          else
            echo "::group::创建 Pages 项目 cloud-fav"
            npx wrangler pages project create cloud-fav --production-branch=main
            echo "::endgroup::"
          fi

      # ---- 部署（wrangler.toml 中的 D1 / AI 绑定会自动生效） ----
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=cloud-fav
